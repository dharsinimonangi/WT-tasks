<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:linear-gradient(135deg,#2563eb,#7c3aed);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            width:400px;
            padding:30px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            margin-bottom:20px;
            color:#2563eb;
        }

        .input-group{
            margin-bottom:15px;
        }

        label{
            display:block;
            margin-bottom:5px;
            font-weight:bold;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        .error{
            color:red;
            font-size:14px;
            margin-top:5px;
        }

        .success{
            color:green;
            text-align:center;
            margin-top:15px;
            font-weight:bold;
        }

        button{
            width:100%;
            padding:12px;
            background:#2563eb;
            color:white;
            border:none;
            border-radius:8px;
            cursor:pointer;
            font-size:16px;
        }

        button:hover{
            background:#1d4ed8;
        }
    </style>
</head>
<body>

<div class="container">

    <h2>Student Registration Form</h2>

    <form id="myForm">

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="name">
            <div id="nameError" class="error"></div>
        </div>

        <div class="input-group">
            <label>Email</label>
            <input type="text" id="email">
            <div id="emailError" class="error"></div>
        </div>

        <button type="submit">Submit</button>

        <div id="successMsg" class="success"></div>

    </form>

</div>

<script src="script.js"></script>

</body>
</html>
